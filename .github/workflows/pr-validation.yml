name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '22.x'

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Check bundle size
        run: |
          BUILD_SIZE=$(du -sh .vercel/output | cut -f1)
          echo "Build size: $BUILD_SIZE"
          echo "### 📦 Build Size: \`$BUILD_SIZE\`" >> $GITHUB_STEP_SUMMARY

      - name: PR Validation Summary
        if: always()
        run: |
          echo "## ✅ PR Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Type checking passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Tests completed" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildSize = require('child_process')
              .execSync('du -sh .vercel/output | cut -f1')
              .toString()
              .trim();
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Validation Passed\n\n- ✓ Type check: Passed\n- ✓ Build: Success\n- 📦 Build size: \`${buildSize}\``
            })
